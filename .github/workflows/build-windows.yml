# ==============================================================================
# 开源改装铺 · 双首发产品 Windows 安装包构建流水线
#
# 触发：Actions 页面手动点 "Run workflow"（workflow_dispatch）。
# 零支出：公开仓库的 windows-latest runner 免费；无代码签名证书
#   （SmartScreen 警告为已知代价，手册已讲透）。
#
# 版本锁定依据：product-a-anythingllm/vendor/VENDOR-NOTES.md（2026-10-11 核实）。
# 升级任一第三方二进制版本时，必须同步更新 VENDOR-NOTES.md 与本文件中的 URL。
#
# 仓库归属待 Yahong 定：本文件交付后，由她（或她授权的人）在网页上建公开仓库，
# 把本 build/ 目录的 .github/ 搬到仓库根目录的 .github/ 即可用。不推送代码。
# ==============================================================================

"name": "Build Windows installers"

"on":
  workflow_dispatch:
    inputs:
      draft_release:
        description: "构建成功后创建一个 draft GitHub Release（附两个安装包，不公开发布）"
        type: boolean
        default: false
      release_tag:
        description: "draft release 的 tag 名（仅 draft_release=true 时使用）"
        type: string
        default: "v1.0.0"

jobs:
  # --------------------------------------------------------------------------
  # 产品A：AnythingLLM 本地知识库问答一键包
  # --------------------------------------------------------------------------
  build-a:
    name: "产品A：AnythingLLM 一键包"
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install NSIS (choco)
        run: choco install nsis -y --no-progress

      - name: Stage vendor binaries（产品A）
        run: |
          # 版本锁定见 product-a-anythingllm/vendor/VENDOR-NOTES.md（2026-10-11 核实）
          $ErrorActionPreference = "Stop"
          $bin = "product-a-anythingllm/vendor/bin"
          New-Item -ItemType Directory -Force "$bin/ffmpeg" | Out-Null

          # 1. Ollama v0.40.3（约 1.5GB；Inno Setup，用户级免 UAC）
          Write-Host "下载 Ollama v0.40.3 ..."
          Invoke-WebRequest -Uri "https://github.com/ollama/ollama/releases/download/v0.40.3/OllamaSetup.exe" `
            -OutFile "$bin/OllamaSetup.exe"
          if ((Get-Item "$bin/OllamaSetup.exe").Length -lt 1GB) { throw "OllamaSetup.exe 体积异常（<1GB），可能下到错误页" }

          # 2. AnythingLLM Desktop v1.17.0（约 410MB；electron-builder NSIS）
          Write-Host "下载 AnythingLLM Desktop v1.17.0 ..."
          Invoke-WebRequest -Uri "https://cdn.anythingllm.com/legacy/1.17.0/AnythingLLMDesktop.exe" `
            -OutFile "$bin/AnythingLLMDesktop.exe"
          if ((Get-Item "$bin/AnythingLLMDesktop.exe").Length -lt 300MB) { throw "AnythingLLMDesktop.exe 体积异常（<300MB）" }

          # 3. 内嵌 Python：从 python.org ftp 目录解析 3.12.x 版本列表，
          #    从最新往旧逐个尝试 embed 包（实测 2026-10-12：3.12.11+ 的
          #    embed-amd64.zip 在 python.org 上 404，只有更早版本有包；
          #    只认"最新版"会在此挂掉，故加回退循环，不硬编码任一版本）
          Write-Host "解析 python.org 3.12.x 版本列表 ..."
          $listing = (Invoke-WebRequest -Uri "https://www.python.org/ftp/python/" -UseBasicParsing).Content
          $versions = ([regex]::Matches($listing, 'href="(3\.12\.\d+)/"') |
            ForEach-Object { $_.Groups[1].Value } |
            Sort-Object { [version]$_ } -Descending | Select-Object -Unique)
          if (-not $versions) { throw "无法从 python.org 解析 3.12.x 版本号" }
          $pyver = $null
          foreach ($v in $versions) {
            Write-Host "尝试内嵌 Python $v ..."
            try {
              Invoke-WebRequest -Uri "https://www.python.org/ftp/python/$v/python-$v-embed-amd64.zip" `
                -OutFile "$bin/python-embed-amd64.zip" -ErrorAction Stop
              if ((Get-Item "$bin/python-embed-amd64.zip").Length -lt 5MB) { throw "体积异常（<5MB）" }
              $pyver = $v
              break
            } catch {
              Write-Host "  $v 的 embed 包不可用，试更早版本 ..."
            }
          }
          if (-not $pyver) { throw "所有 3.12.x 版本的 embed 包均下载失败" }
          Write-Host "使用内嵌 Python $pyver"
          # 记录实际版本，供排查
          "python_embed=$pyver" | Out-File -FilePath "$env:GITHUB_OUTPUT" -Append -Encoding utf8

          # 4. FFmpeg 静态构建（gyan.dev essentials；check_ffmpeg.py 的 fallback 用）
          Write-Host "下载 FFmpeg（gyan.dev essentials）..."
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" `
            -OutFile "$env:RUNNER_TEMP/ffmpeg.zip"
          Expand-Archive "$env:RUNNER_TEMP/ffmpeg.zip" "$env:RUNNER_TEMP/ff" -Force
          $ffdir = Get-ChildItem "$env:RUNNER_TEMP/ff" -Directory | Select-Object -First 1
          Copy-Item "$($ffdir.FullName)/bin/ffmpeg.exe" "$bin/ffmpeg/ffmpeg.exe"
          if ((Get-Item "$bin/ffmpeg/ffmpeg.exe").Length -lt 20MB) { throw "ffmpeg.exe 体积异常（<20MB）" }
          & "$bin/ffmpeg/ffmpeg.exe" -version | Select-Object -First 1

          Write-Host "vendor/bin 内容："
          Get-ChildItem $bin -Recurse | ForEach-Object { "{0,12:N0} MB  {1}" -f ($_.Length/1MB), $_.FullName }

      - name: Compile NSIS（产品A）
        run: |
          $ErrorActionPreference = "Stop"
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $makensis) { $makensis = "C:\Program Files (x86)\NSIS\makensis.exe" }
          if (-not (Test-Path $makensis)) { throw "找不到 makensis（choco nsis 安装异常）" }
          # makensis 默认 cd 到脚本所在目录，相对 File 路径（..\downloader 等）据此解析
          Push-Location "product-a-anythingllm/installer"
          & $makensis -V4 "anythingllm-oneclick.nsi"
          if ($LASTEXITCODE -ne 0) { throw "makensis 编译产品A失败" }
          Pop-Location
          Get-Item "product-a-anythingllm/installer/AnythingLLM-OneClick-Setup.exe"

      - name: Upload installer artifact（产品A）
        uses: actions/upload-artifact@v4
        with:
          name: AnythingLLM-OneClick-Setup
          path: product-a-anythingllm/installer/AnythingLLM-OneClick-Setup.exe
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # 产品B：老片修复一键包
  # --------------------------------------------------------------------------
  build-b:
    name: "产品B：老片修复一键包"
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install NSIS (choco)
        run: choco install nsis -y --no-progress

      - name: Stage build files（产品B）
        run: |
          $ErrorActionPreference = "Stop"
          $stg = "product-b-photo-restore/staging"
          New-Item -ItemType Directory -Force "$stg/app", "$stg/models", "$stg/ffmpeg", "$stg/python", "$stg/wheels", "$stg/launcher" | Out-Null

          # 1. 便携 Python：python-build-standalone（自带 pip，开箱即用）
          #    来源：https://github.com/astral-sh/python-build-standalone
          Write-Host "下载 python-build-standalone（cpython 3.12，windows amd64，install_only）..."
          gh release download --repo astral-sh/python-build-standalone `
            --pattern "cpython-3.12.*x86_64-pc-windows-msvc-install_only.tar.gz" `
            --dir "$env:RUNNER_TEMP/pbs"
          $pbs = Get-ChildItem "$env:RUNNER_TEMP/pbs/*.tar.gz"
          if ($pbs.Count -ne 1) { throw "python-build-standalone 匹配到 $($pbs.Count) 个文件，预期 1 个（上游改名请检查）" }
          tar -xzf $pbs[0].FullName -C "$env:RUNNER_TEMP/pbs"
          Copy-Item "$env:RUNNER_TEMP/pbs/python/*" "$stg/python/" -Recurse -Force
          & "$stg/python/python.exe" --version
          & "$stg/python/python.exe" -m pip --version
          # GUI 用 Tkinter：构建机上先验证 _tkinter 可用（缺失则 loud fail，不静默打包坏包）
          & "$stg/python/python.exe" -c "import tkinter; print('tkinter OK', tkinter.TkVersion)"

          # 2. torch CPU wheel + pillow + numpy（离线安装用）
          #    torch 走官方 CPU 源（runner 在美国，直连可达）；pillow/numpy 走清华镜像
          Write-Host "下载 torch CPU wheel（含依赖闭包）..."
          & "$stg/python/python.exe" -m pip download torch --only-binary=:all: `
            --dest "$stg/wheels" --index-url "https://download.pytorch.org/whl/cpu"
          Write-Host "下载 pillow + numpy（清华镜像）..."
          & "$stg/python/python.exe" -m pip download pillow numpy --only-binary=:all: `
            --dest "$stg/wheels" --index-url "https://pypi.tuna.tsinghua.edu.cn/simple"
          $torchWheel = Get-ChildItem "$stg/wheels/torch-*.whl" | Select-Object -First 1
          if (-not $torchWheel) { throw "wheels/ 下没有 torch wheel" }
          if ($torchWheel.Length -gt 400MB) { throw "torch wheel 超过 400MB，可能误下成 CUDA 版：$($torchWheel.Name)" }
          $torchVer = $torchWheel.BaseName -replace '^torch-([^-]+).*$','$1'
          Write-Host "torch wheel：$($torchWheel.Name)（$([math]::Round($torchWheel.Length/1MB)) MB）"

          # 3. FFmpeg 静态构建（gyan.dev essentials；视频管线用）
          Write-Host "下载 FFmpeg（gyan.dev essentials）..."
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" `
            -OutFile "$env:RUNNER_TEMP/ffmpeg.zip"
          Expand-Archive "$env:RUNNER_TEMP/ffmpeg.zip" "$env:RUNNER_TEMP/ff" -Force
          $ffdir = Get-ChildItem "$env:RUNNER_TEMP/ff" -Directory | Select-Object -First 1
          Copy-Item "$($ffdir.FullName)/bin/ffmpeg.exe" "$stg/ffmpeg/ffmpeg.exe"
          Copy-Item "$($ffdir.FullName)/bin/ffprobe.exe" "$stg/ffmpeg/ffprobe.exe"
          & "$stg/ffmpeg/ffmpeg.exe" -version | Select-Object -First 1

          # 4. 权重：ModelScope damo/cv_rrdb_image-super-resolution 的 pytorch_model.pt（64MB，内置）
          #    直链模式经 Phase 1 curl 实测（206 + Accept-Ranges: bytes）
          Write-Host "下载权重 pytorch_model.pt（ModelScope）..."
          curl.exe -L --fail --retry 3 -o "$stg/models/pytorch_model.pt" `
            "https://modelscope.cn/api/v1/models/damo/cv_rrdb_image-super-resolution/repo?Revision=master&FilePath=pytorch_model.pt"
          if ((Get-Item "$stg/models/pytorch_model.pt").Length -lt 50MB) { throw "pytorch_model.pt 体积异常（<50MB）" }

          # 5. 组装 staging/app（源码）与 staging/launcher（启动器）
          Copy-Item "product-b-photo-restore/core/*" "$stg/app/" -Recurse -Force
          Copy-Item "product-b-photo-restore/gui/*" "$stg/app/" -Recurse -Force
          @{ torch_version = $torchVer; python = "cpython-3.12 (python-build-standalone)";
             weight = "damo/cv_rrdb_image-super-resolution pytorch_model.pt";
             built = (Get-Date -Format "yyyy-MM-dd") } |
            ConvertTo-Json | Out-File "$stg/app/version.json" -Encoding utf8
          Copy-Item "product-b-photo-restore/installer/launcher/*" "$stg/launcher/" -Recurse -Force
          if (Test-Path "product-b-photo-restore/installer/launcher/icon.ico") {
            Write-Host "icon.ico 已就位"
          } else {
            Write-Host "无 icon.ico：NSIS 将用默认图标（BUILD-NOTES V9，不阻塞）"
          }

          Write-Host "staging 内容："
          Get-ChildItem $stg -Recurse -File | ForEach-Object { "{0,10:N0} MB  {1}" -f ($_.Length/1MB), $_.FullName }

      - name: Compile NSIS（产品B）
        run: |
          $ErrorActionPreference = "Stop"
          $makensis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $makensis) { $makensis = "C:\Program Files (x86)\NSIS\makensis.exe" }
          if (-not (Test-Path $makensis)) { throw "找不到 makensis（choco nsis 安装异常）" }
          Push-Location "product-b-photo-restore/installer"
          & $makensis -V4 "photorestore-oneclick.nsi"
          if ($LASTEXITCODE -ne 0) { throw "makensis 编译产品B失败" }
          Pop-Location
          Get-Item "product-b-photo-restore/installer/PhotoRestore-OneClick-Setup.exe"

      - name: Upload installer artifact（产品B）
        uses: actions/upload-artifact@v4
        with:
          name: PhotoRestore-OneClick-Setup
          path: product-b-photo-restore/installer/PhotoRestore-OneClick-Setup.exe
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # 可选：draft Release（默认关闭；手动触发时勾选 draft_release 才执行）
  # --------------------------------------------------------------------------
  draft-release:
    name: "Draft Release（可选）"
    needs: [build-a, build-b]
    if: ${{ inputs.draft_release }}
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "开源改装铺双首发 ${{ inputs.release_tag }}（草稿）"
          body: |
            双首发产品 Windows 安装包（草稿，未公开发布）：
            - AnythingLLM-OneClick-Setup.exe（产品A：本地知识库问答一键包）
            - PhotoRestore-OneClick-Setup.exe（产品B：老片修复一键包）
            无代码签名，首次运行有 SmartScreen 警告（手册已讲透）。
          draft: true
          files: installers/*.exe
